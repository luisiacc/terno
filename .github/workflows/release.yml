# Plans 126 and 189: `pnpm release` starts this. Two builds run side by side: macOS (signed and notarized on GitHub's
# Mac) and Linux (deb and rpm for x64 and arm64, installed and smoke-tested before they're kept). When both pass, the
# draft job creates ONE draft release with every file (apps/desktop/scripts/release.mjs, one phase per job). Nothing
# reaches users until the maintainer publishes the draft.
#
# Only a person with write access can start it (workflow_dispatch; never pull_request, so a fork never sees a secret).
# The build jobs' secrets live in the "release" environment, which deploys from main only; the draft job holds no
# secret and is the only one that can write to the repository. RELEASING.md lists the secrets and how to make each one.
name: Release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "main's tip when you started (full SHA): the run stops if main moved since"
        required: true
      version:
        description: "Only for a nightly (x.y.z-nightly.n): empty = apps/desktop/package.json's version"
        required: false
        default: ""

# nothing by default: each job asks for what it uses
permissions: {}

# one release at a time: a second waits rather than cancelling one halfway through notarization (GitHub keeps only
# the newest waiting run, so a third start replaces a waiting second)
concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ inputs.sha }}
  TERNO_VERSION: ${{ inputs.version }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
    steps:
      # main's tip (the ref the run was started on), with main's own release tooling; actions are pinned to commits
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The commit is main's tip
        run: |
          [ "$GITHUB_SHA" = "$RELEASE_SHA" ] || { echo "✗ main moved since you started ($RELEASE_SHA → $GITHUB_SHA): pull, then run pnpm release again"; exit 1; }

      # before anything is installed: every secret this job uses, by name (never a value), and the version's shape
      - name: Check the secrets
        env:
          TERNO_GOOGLE_DESKTOP_ID: ${{ secrets.TERNO_GOOGLE_DESKTOP_ID }}
          TERNO_GOOGLE_DESKTOP_SECRET: ${{ secrets.TERNO_GOOGLE_DESKTOP_SECRET }}
          TERNO_GOOGLE_WEB_ID: ${{ secrets.TERNO_GOOGLE_WEB_ID }}
        run: node apps/desktop/scripts/release-ci.mjs check build-linux

      # rpmbuild for the .rpm; a display, a session bus and a keyring for the smoke test
      - name: Install the packaging and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm xvfb xauth dbus-x11 gnome-keyring libsecret-1-0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # optional: source maps to Sentry (scripts/upload-maps.mjs); without a token they stay in the artifact below
      - name: Sign in to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then echo "no SENTRY_AUTH_TOKEN: source maps go to the workflow's artifact only"; exit 0; fi
          curl -fsSL https://cli.sentry.dev/install | SENTRY_INSTALL_DIR="$HOME/.local/bin" bash -s -- --no-modify-path
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/sentry" auth login --token "$SENTRY_AUTH_TOKEN"

      - name: Build and package for Linux
        env:
          TERNO_GOOGLE_DESKTOP_ID: ${{ secrets.TERNO_GOOGLE_DESKTOP_ID }}
          TERNO_GOOGLE_DESKTOP_SECRET: ${{ secrets.TERNO_GOOGLE_DESKTOP_SECRET }}
          TERNO_GOOGLE_DESKTOP_DEV_ID: ${{ secrets.TERNO_GOOGLE_DESKTOP_DEV_ID }}
          TERNO_GOOGLE_DESKTOP_DEV_SECRET: ${{ secrets.TERNO_GOOGLE_DESKTOP_DEV_SECRET }}
          TERNO_GOOGLE_WEB_ID: ${{ secrets.TERNO_GOOGLE_WEB_ID }}
        run: node apps/desktop/scripts/release.mjs build-linux

      # the x64 deb as a user installs it: /opt/Terno, the desktop entry, and the sandbox set up by its install script
      # (a setuid helper, or user namespaces through its AppArmor profile). Unprivileged user namespaces are restricted
      # first, as on a stock Ubuntu 24.04 desktop, so a sandboxed renderer below proves the profile works
      - name: Install the x64 package
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          sudo apt-get install -y ./apps/desktop/release/Terno-*-linux-amd64.deb
          [ -x /opt/Terno/terno ] || { echo "✗ /opt/Terno/terno missing after install"; exit 1; }
          [ -f /usr/share/applications/terno.desktop ] || { echo "✗ no desktop entry"; exit 1; }
          if [ "$(stat -c %a /opt/Terno/chrome-sandbox)" != 4755 ]; then sudo test -f /etc/apparmor.d/terno || { echo "✗ neither a setuid sandbox nor the AppArmor profile"; exit 1; }; fi

      - name: Smoke-test the installed app
        run: |
          dbus-run-session -- sh -c 'eval "$(printf smoke | gnome-keyring-daemon --unlock --components=secrets)"; export GNOME_KEYRING_CONTROL; xvfb-run -a -s "-screen 0 1440x900x24" pnpm --filter @terno/desktop test:smoke:linux'

      - name: Keep the packages for the draft
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: |
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
          if-no-files-found: error
          retention-days: 7

      # the runner's copy vanishes with it: `pnpm diag:symbolicate` needs these for this release's reports
      - name: Keep the source maps
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-maps-linux-${{ inputs.sha }}
          path: |
            apps/desktop/.maps/
            apps/web/.maps/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90

  mac:
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    steps:
      # this job holds the signing key: actions pinned to commits, and the checkout's token kept off the disk
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The commit is main's tip
        run: |
          [ "$GITHUB_SHA" = "$RELEASE_SHA" ] || { echo "✗ main moved since you started ($RELEASE_SHA → $GITHUB_SHA): pull, then run pnpm release again"; exit 1; }

      # before anything is installed: every secret this job uses, by name (never a value), and the version's shape
      - name: Check the secrets
        env:
          TERNO_GOOGLE_DESKTOP_ID: ${{ secrets.TERNO_GOOGLE_DESKTOP_ID }}
          TERNO_GOOGLE_DESKTOP_SECRET: ${{ secrets.TERNO_GOOGLE_DESKTOP_SECRET }}
          TERNO_GOOGLE_WEB_ID: ${{ secrets.TERNO_GOOGLE_WEB_ID }}
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node apps/desktop/scripts/release-ci.mjs check build-mac

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # with lifecycle scripts: the root postinstall installs Electron's binary, which packaging copies
      - run: pnpm install --frozen-lockfile

      # optional: source maps to Sentry (scripts/upload-maps.mjs); without a token they stay in the artifact below.
      # Installed before the signing key and the notarization key exist on this machine
      - name: Sign in to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then echo "no SENTRY_AUTH_TOKEN: source maps go to the workflow's artifact only"; exit 0; fi
          curl -fsSL https://cli.sentry.dev/install | SENTRY_INSTALL_DIR="$HOME/.local/bin" bash -s -- --no-modify-path
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/sentry" auth login --token "$SENTRY_AUTH_TOKEN"

      # a throwaway keychain with a random password: codesign may use the key without a prompt, and nothing outlives the job
      - name: Import the Developer ID certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/terno-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -f pkcs12 -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -1)"
          [ -n "$IDENTITY" ] || { echo "✗ MAC_CERT_P12 holds no Developer ID Application identity with its private key (RELEASING.md)"; exit 1; }
          # sign a scratch file now, so a key codesign can't use fails here, not after the build
          printf 'probe' > "$RUNNER_TEMP/probe"
          if ! codesign --force --sign "$IDENTITY" --timestamp=none "$RUNNER_TEMP/probe"; then echo "✗ codesign can't use the key in MAC_CERT_P12 (RELEASING.md)"; exit 1; fi
          rm -f "$RUNNER_TEMP/probe"
          echo "✓ signing as $IDENTITY"

      # electron-builder's notarize reads APPLE_API_KEY as a path to the .p8
      - name: Write the notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/notary"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/notary/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/notary/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          TERNO_GOOGLE_DESKTOP_ID: ${{ secrets.TERNO_GOOGLE_DESKTOP_ID }}
          TERNO_GOOGLE_DESKTOP_SECRET: ${{ secrets.TERNO_GOOGLE_DESKTOP_SECRET }}
          TERNO_GOOGLE_DESKTOP_DEV_ID: ${{ secrets.TERNO_GOOGLE_DESKTOP_DEV_ID }}
          TERNO_GOOGLE_DESKTOP_DEV_SECRET: ${{ secrets.TERNO_GOOGLE_DESKTOP_DEV_SECRET }}
          TERNO_GOOGLE_WEB_ID: ${{ secrets.TERNO_GOOGLE_WEB_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node apps/desktop/scripts/release.mjs build-mac

      - name: Keep the app for the draft
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-mac
          path: |
            apps/desktop/release/*-mac.zip
            apps/desktop/release/*-mac.zip.blockmap
            apps/desktop/release/*-mac.yml
            apps/desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 7

      # the runner's copy vanishes with it: `pnpm diag:symbolicate` needs these for this release's reports
      - name: Keep the source maps
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-maps-mac-${{ inputs.sha }}
          path: |
            apps/desktop/.maps/
            apps/web/.maps/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90

      - name: Remove the keychain and the key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/terno-signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/notary" "$RUNNER_TEMP/cert.p12"

  # both builds passed: one draft with every platform's files. No secret, no install, the only write permission
  draft:
    needs: [linux, mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The commit is main's tip
        run: |
          [ "$GITHUB_SHA" = "$RELEASE_SHA" ] || { echo "✗ main moved since you started ($RELEASE_SHA → $GITHUB_SHA): pull, then run pnpm release again"; exit 1; }

      - name: Check the version
        run: node apps/desktop/scripts/release-ci.mjs check draft

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-mac
          path: ${{ runner.temp }}/release-mac

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux
          path: ${{ runner.temp }}/release-linux

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/release.mjs draft "$RUNNER_TEMP/release-mac" "$RUNNER_TEMP/release-linux"
