# Plan 126: `pnpm release:mac` starts this. It builds, signs and notarizes Terno on GitHub's Mac, then creates the
# DRAFT release (apps/desktop/scripts/release.mjs, the same script as `pnpm release:mac --local`). Nothing reaches
# users until the maintainer publishes the draft.
#
# Only a person with write access can start it (workflow_dispatch; never pull_request, so a fork never sees a secret).
# The secrets live in the "release" environment, which deploys from main only. RELEASING.md lists them and how to
# make each one.
name: Release (macOS)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "main's tip when you started (full SHA): the run stops if main moved since"
        required: true
      version:
        description: "Only for a nightly (x.y.z-nightly.n): empty = apps/desktop/package.json's version"
        required: false
        default: ""

permissions:
  contents: write # the draft release

# one release at a time: a second waits rather than cancelling one halfway through notarization (GitHub keeps only
# the newest waiting run, so a third start replaces a waiting second)
concurrency:
  group: release-mac
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    env:
      RELEASE_SHA: ${{ inputs.sha }}
      TERNO_VERSION: ${{ inputs.version }}
    steps:
      # main's tip (the ref the run was started on), with main's own release tooling; actions are pinned to commits
      # because this job holds the signing key
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The commit is main's tip
        run: |
          [ "$GITHUB_SHA" = "$RELEASE_SHA" ] || { echo "✗ main moved since you started ($RELEASE_SHA → $GITHUB_SHA): pull, then run pnpm release:mac again"; exit 1; }

      # before anything is installed: every secret by name (never a value), and the version's shape
      - name: Check the secrets
        env:
          TERNO_GOOGLE_DESKTOP_ID: ${{ secrets.TERNO_GOOGLE_DESKTOP_ID }}
          TERNO_GOOGLE_DESKTOP_SECRET: ${{ secrets.TERNO_GOOGLE_DESKTOP_SECRET }}
          TERNO_GOOGLE_WEB_ID: ${{ secrets.TERNO_GOOGLE_WEB_ID }}
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node apps/desktop/scripts/release-ci.mjs check

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # with lifecycle scripts: the root postinstall installs Electron's binary, which packaging copies
      - run: pnpm install --frozen-lockfile

      # optional: source maps to Sentry (scripts/upload-maps.mjs); without a token they stay in the artifact below.
      # Installed before the signing key and the notarization key exist on this machine
      - name: Sign in to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then echo "no SENTRY_AUTH_TOKEN: source maps go to the workflow's artifact only"; exit 0; fi
          curl -fsSL https://cli.sentry.dev/install | SENTRY_INSTALL_DIR="$HOME/.local/bin" bash -s -- --no-modify-path
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/sentry" auth login --token "$SENTRY_AUTH_TOKEN"

      # a throwaway keychain with a random password: codesign may use the key without a prompt, and nothing outlives the job
      - name: Import the Developer ID certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/terno-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -f pkcs12 -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -1)"
          [ -n "$IDENTITY" ] || { echo "✗ MAC_CERT_P12 holds no Developer ID Application identity with its private key (RELEASING.md)"; exit 1; }
          # sign a scratch file now, so a key codesign can't use fails here, not after the build
          printf 'probe' > "$RUNNER_TEMP/probe"
          if ! codesign --force --sign "$IDENTITY" --timestamp=none "$RUNNER_TEMP/probe"; then echo "✗ codesign can't use the key in MAC_CERT_P12 (RELEASING.md)"; exit 1; fi
          rm -f "$RUNNER_TEMP/probe"
          echo "✓ signing as $IDENTITY"

      # electron-builder's notarize reads APPLE_API_KEY as a path to the .p8
      - name: Write the notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/notary"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/notary/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/notary/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize and draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TERNO_GOOGLE_DESKTOP_ID: ${{ secrets.TERNO_GOOGLE_DESKTOP_ID }}
          TERNO_GOOGLE_DESKTOP_SECRET: ${{ secrets.TERNO_GOOGLE_DESKTOP_SECRET }}
          TERNO_GOOGLE_DESKTOP_DEV_ID: ${{ secrets.TERNO_GOOGLE_DESKTOP_DEV_ID }}
          TERNO_GOOGLE_DESKTOP_DEV_SECRET: ${{ secrets.TERNO_GOOGLE_DESKTOP_DEV_SECRET }}
          TERNO_GOOGLE_WEB_ID: ${{ secrets.TERNO_GOOGLE_WEB_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node apps/desktop/scripts/release.mjs

      # the runner's copy vanishes with it: `pnpm diag:symbolicate` needs these for this release's reports
      - name: Keep the source maps
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-maps-${{ inputs.sha }}
          path: |
            apps/desktop/.maps/
            apps/web/.maps/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90

      - name: Remove the keychain and the key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/terno-signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/notary" "$RUNNER_TEMP/cert.p12"
